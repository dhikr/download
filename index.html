<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07050a">
<title>DHIKRVERSE</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== COLORS ===== */
:root{--gold:#e8bb5c;--gold2:#c98a1e;--gold3:#fbe9b8;--rose:#d0687c;--bg:#07050a;--line:rgba(232,187,92,.22);--text:#f6ecdb;--mute:#b5a58c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.7;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
 radial-gradient(60% 45% at 50% -8%,rgba(232,187,92,.30),transparent 70%),
 radial-gradient(45% 35% at 105% 40%,rgba(208,104,124,.22),transparent 70%),
 radial-gradient(45% 35% at -5% 85%,rgba(232,187,92,.12),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
 background-image:linear-gradient(rgba(232,187,92,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(232,187,92,.05) 1px,transparent 1px);background-size:56px 56px;
 -webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent 75%)}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 4s infinite ease-in-out}
#stars i:nth-child(3n){width:3px;height:3px;background:var(--gold3);box-shadow:0 0 8px var(--gold)}
@keyframes tw{50%{opacity:.05;transform:scale(.6)}}
.z{position:relative;z-index:1}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.3s}.d4{animation-delay:.42s}.d5{animation-delay:.55s}

.bar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:rgba(7,5,10,.55);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.logo{font-family:Outfit;font-weight:700;letter-spacing:.34em;direction:ltr;font-size:1.05rem;background:linear-gradient(100deg,var(--gold),var(--gold3),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 18px;font:500 .85rem 'Readex Pro';cursor:pointer;transition:.25s}
.pill:hover,.pill:focus-visible{border-color:var(--gold);box-shadow:0 0 22px rgba(232,187,92,.3);outline:none}

.hero{--mx:0;--my:0;max-width:1140px;margin:auto;padding:70px 24px 30px;display:grid;grid-template-columns:1fr 1.05fr;gap:20px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:6px 18px;font-size:.82rem;color:var(--gold3);margin-bottom:22px;background:linear-gradient(135deg,rgba(232,187,92,.14),rgba(232,187,92,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(232,187,92,.7);animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 9px rgba(232,187,92,0)}100%{box-shadow:0 0 0 0 rgba(232,187,92,0)}}
h1{font-weight:600;font-size:clamp(2.3rem,5.8vw,4rem);line-height:1.25;letter-spacing:-.01em;background:linear-gradient(100deg,var(--gold),var(--gold3) 30%,var(--rose) 60%,var(--gold) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 7s linear infinite;filter:drop-shadow(0 4px 30px rgba(232,187,92,.25))}
@keyframes gs{to{background-position:-220% 0}}
.sub{color:var(--mute);font-weight:300;margin:20px 0 36px;max-width:29em;font-size:1.08rem}

.dl{position:relative;display:inline-flex;align-items:center;gap:14px;padding:20px 46px;border-radius:999px;border:1px solid #fbe3a3;background:linear-gradient(180deg,#fbdf94 0%,#e8ae3c 55%,#c98a1e 100%);color:#1c1105;font:600 1.18rem 'Readex Pro';cursor:pointer;overflow:visible;isolation:isolate;box-shadow:0 0 0 6px rgba(232,187,92,.10),0 14px 50px rgba(232,170,60,.45),inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(120,70,0,.25);transition:transform .25s,box-shadow .25s}
.dl::before{content:"";position:absolute;inset:-2px;border-radius:inherit;z-index:-1;border:2px solid var(--gold);animation:rp 2.6s infinite}
@keyframes rp{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.28,1.5);opacity:0}}
.dl::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;border-radius:inherit;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:sh 3.4s infinite}
@keyframes sh{0%,55%{left:-70%}100%{left:150%}}
.dl:hover,.dl:focus-visible{transform:translateY(-4px) scale(1.03);box-shadow:0 0 0 8px rgba(232,187,92,.16),0 20px 70px rgba(232,170,60,.65),inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(120,70,0,.25);outline:none}
.dl:active{transform:translateY(0) scale(.98)}
.dl svg{width:24px;height:24px;animation:bn 1.8s ease-in-out infinite}
@keyframes bn{50%{transform:translateY(3px)}}
.meta{margin-top:20px;font-size:.86rem;color:var(--mute);letter-spacing:.02em}

.phones{position:relative;height:600px;direction:ltr;perspective:1200px}
.orb{position:absolute;left:50%;top:48%;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;background:radial-gradient(circle,rgba(232,187,92,.40),rgba(208,104,124,.16) 45%,transparent 70%);filter:blur(24px);animation:ob 7s ease-in-out infinite}
@keyframes ob{50%{transform:scale(1.14);opacity:.8}}
.ringx{position:absolute;left:50%;top:48%;border-radius:50%;border:1px solid var(--line);transform:translate(-50%,-50%)}
.ringx.r1{width:380px;height:380px;animation:spin 40s linear infinite;border-style:dashed}
.ringx.r2{width:520px;height:520px;opacity:.55}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.ph{position:absolute;width:212px;border-radius:34px;padding:5px;background:linear-gradient(145deg,#f7dc96,#7a5316 40%,#e8bb5c 70%,#5a3b0c);box-shadow:0 30px 80px rgba(0,0,0,.85);transition:transform .25s ease-out}
.ph img{display:block;width:100%;border-radius:30px;background:#000}
.ph::after{content:"";position:absolute;inset:5px;border-radius:30px;background:linear-gradient(120deg,rgba(255,255,255,.18),transparent 35%);pointer-events:none}
.ph.a{left:1%;top:96px;transform:rotate(-8deg) translate(calc(var(--mx)*-16px),calc(var(--my)*-10px))}
.ph.b{left:50%;margin-left:-125px;top:10px;width:250px;z-index:2;box-shadow:0 30px 110px rgba(232,187,92,.38),0 30px 80px rgba(0,0,0,.85);animation:fl 6s ease-in-out infinite;translate:calc(var(--mx)*22px) calc(var(--my)*14px)}
.ph.c{right:1%;top:120px;transform:rotate(8deg) translate(calc(var(--mx)*-16px),calc(var(--my)*-10px))}
@keyframes fl{50%{margin-top:-14px}}

.wrap{max-width:1140px;margin:auto;padding:60px 24px 30px}
h2{display:flex;align-items:center;gap:18px;font-size:1.5rem;font-weight:600;color:var(--gold3);margin-bottom:22px}
h2::before,h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
.sc{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px 6px 34px;direction:ltr;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.sc::-webkit-scrollbar{display:none}
.sc figure{flex:none;width:236px;scroll-snap-align:center;text-align:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sc figure:hover{transform:translateY(-14px) scale(1.04)}
.sc img{width:100%;display:block;border-radius:30px;border:5px solid transparent;background:linear-gradient(#000,#000) padding-box,linear-gradient(145deg,#f7dc96,#7a5316 40%,#e8bb5c 70%,#5a3b0c) border-box;box-shadow:0 22px 60px rgba(0,0,0,.7);transition:box-shadow .35s}
.sc figure:hover img{box-shadow:0 26px 80px rgba(232,187,92,.4)}
.sc figcaption{display:inline-block;margin-top:16px;padding:4px 18px;border:1px solid var(--line);border-radius:999px;font-size:.86rem;color:var(--gold3);background:rgba(232,187,92,.07)}
footer{text-align:center;padding:40px 22px 56px;color:var(--mute);font-size:.9rem;position:relative}
footer::before{content:"";display:block;width:140px;height:1px;margin:0 auto 26px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
@media(max-width:820px){.hero{grid-template-columns:1fr;text-align:center;padding-top:30px}.sub{margin-inline:auto}.badge{margin-inline:auto}.phones{height:470px;order:-1}.orb{width:320px;height:320px;margin:-160px 0 0 -160px}.ringx.r1{width:290px;height:290px}.ringx.r2{width:400px;height:400px}.ph{width:150px;border-radius:26px;padding:4px}.ph img,.ph::after{border-radius:22px}.ph.a{top:80px}.ph.c{top:100px}.ph.b{width:176px;margin-left:-92px}.dl{padding:18px 38px;font-size:1.1rem}.sc figure{width:200px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.in{opacity:1}}
</style>
<script data-goatcounter="https://umbra.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
