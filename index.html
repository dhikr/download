<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHIKRVERSE</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* ===== EDIT COLORS HERE ===== */
:root{--gold:#e6b85a;--gold2:#c98a1e;--rose:#d0687c;--bg:#0a0709;--card:#150f0e;--line:rgba(230,184,90,.25);--text:#f5ebda;--mute:#b8a88e}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(55% 38% at 50% -2%,rgba(230,184,90,.22),transparent 70%),radial-gradient(45% 30% at 100% 45%,rgba(208,104,124,.16),transparent 70%),radial-gradient(40% 30% at 0% 80%,rgba(230,184,90,.09),transparent 70%)}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 4s infinite ease-in-out}
@keyframes tw{50%{opacity:.05}}
.z{position:relative;z-index:1}
.bar{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);max-width:1100px;margin:auto}
.logo{font-family:Outfit;font-weight:700;letter-spacing:.3em;color:var(--gold);direction:ltr;font-size:1.05rem}
.pill{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 16px;font:inherit;font-size:.85rem;cursor:pointer}
.pill:hover,.pill:focus-visible{border-color:var(--gold);outline:none}
.hero{max-width:1100px;margin:auto;padding:60px 22px 40px;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.8rem;color:var(--gold);margin-bottom:18px;background:rgba(230,184,90,.06)}
h1{font-weight:600;font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:1.3;background:linear-gradient(100deg,var(--gold),#fbe9b8 45%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-weight:300;margin:16px 0 30px;max-width:30em;font-size:1.05rem}
.dl{display:inline-flex;align-items:center;gap:12px;padding:17px 38px;border-radius:999px;border:1px solid #f3d089;background:linear-gradient(135deg,#f5d286,var(--gold2));color:#1b1006;font:600 1.12rem 'Readex Pro';cursor:pointer;box-shadow:0 0 40px rgba(230,184,90,.4),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.dl::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sh 3.2s infinite}
@keyframes sh{0%,55%{left:-60%}100%{left:140%}}
.dl:hover,.dl:focus-visible{transform:translateY(-3px);box-shadow:0 0 64px rgba(230,184,90,.6);outline:none}
.dl svg{width:22px;height:22px}
.meta{margin-top:16px;font-size:.85rem;color:var(--mute)}
.phones{position:relative;height:560px;direction:ltr}
.ph{position:absolute;width:210px;border-radius:30px;border:1px solid rgba(230,184,90,.4);box-shadow:0 24px 70px rgba(0,0,0,.8);display:block;background:#000}
.ph.a{left:2%;top:70px;transform:rotate(-7deg)}
.ph.b{left:50%;margin-left:-118px;top:0;width:236px;z-index:2;box-shadow:0 24px 90px rgba(230,184,90,.3);animation:fl 6s ease-in-out infinite}
.ph.c{right:2%;top:90px;transform:rotate(7deg)}
@keyframes fl{50%{transform:translateY(-12px)}}
.wrap{max-width:1100px;margin:auto;padding:46px 22px}
h2{font-size:1.6rem;font-weight:600;color:var(--gold);margin-bottom:8px}
.lead{color:var(--mute);font-weight:300;margin-bottom:26px}
.sc{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 22px;direction:ltr}
.sc figure{flex:none;width:230px;scroll-snap-align:center;text-align:center}
.sc img{width:100%;border-radius:26px;border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.6);display:block}
.sc figcaption{margin-top:10px;color:var(--mute);font-size:.9rem;direction:inherit}
footer{text-align:center;padding:30px 22px 50px;color:var(--mute);font-size:.9rem}
@media(max-width:800px){.hero{grid-template-columns:1fr}.hero{text-align:center;padding-top:30px}.sub{margin-inline:auto}.phones{height:450px;order:-1}.ph{width:150px}.ph.b{width:172px;margin-left:-86px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="stars"></div>
<header class="bar z"><span class="logo">DHIKRVERSE</span><button class="pill" id="lang">EN</button></header>
<main class="z">
<section class="hero">
  <div>
    <span class="badge" id="badge"></span>
    <h1 id="tag"></h1>
    <p class="sub" id="sub"></p>
    <button class="dl" id="dl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg><span id="dlt"></span></button>
    <p class="meta" id="meta"></p>
  </div>
  <div class="phones"><img class="ph a" src="screens/duas.jpg" alt=""><img class="ph b" src="screens/home.jpg" alt=""><img class="ph c" src="screens/prayer.jpg" alt=""></div>
</section>

<section class="wrap"><h2 id="sh"></h2>
  <div class="sc" id="sc"></div>
</section>

</main>
<footer class="z" id="foot"></footer>

<script>
/* ===== EDIT TEXT HERE ===== */
/* ===== APK LINK (GitHub raw file) ===== */
const APK_URL="https://raw.githubusercontent.com/umbravexyt3214/Dhikr-download/main/%D8%A7%D8%B0%D9%83%D8%A7%D8%B1_1.apk";
const SITE={version:"1.0",size:"6.6 MB",android:"Android 7+",fileName:"dhikrverse.apk",
shots:["screens/home.jpg","screens/tasbih.jpg","screens/duas.jpg","screens/prayer.jpg"],
ar:{badge:"مجاني · بدون إعلانات",tag:"أذكارك وأدعيتك وصلاتك في مكان واحد",sub:"مسبحة رقمية، أدعية من القرآن والسنة الصحيحة، ومواقيت الصلاة مع اتجاه القبلة.",dl:"تحميل التطبيق",wait:"جارٍ التحميل…",meta:"الإصدار {v} · {s} · {a}",
demo:"جرّب المسبحة الآن",demop:"المس الدائرة لتسبّح. هكذا يعمل التطبيق بالضبط.",shots:"لقطات من التطبيق",cap:["الرئيسية","المسبحة","الأدعية","الصلاة"],
fh:"ما بداخل التطبيق",features:[["📿","مسبحة رقمية","أهداف يومية وعدّاد للأيام المتتالية."],["🤲","أدعية موثّقة","بعد الصلاة، النوم، الاستيقاظ، الكرب والهم وغيرها."],["🕌","الصلاة والقبلة","سجّل صلواتك واعرف الشروق والغروب واتجاه القبلة."],["📊","إحصائيات","تابع تقدّمك يومًا بيوم."]],
ih:"طريقة التثبيت",steps:["اضغط «تحميل التطبيق» وانتظر انتهاء التنزيل.","افتح الملف، وإن ظهر تنبيه فاسمح بالتثبيت من هذا المصدر.","اضغط «تثبيت» ثم افتح التطبيق."],foot:"صُنع بحب 🤍",tone:"سُبْحَانَ اللّٰه"},
en:{badge:"Free · No ads",tag:"Your adhkar, duas and prayers in one place",sub:"A digital tasbih, duas from the Quran and authentic Sunnah, and prayer times with qibla direction.",dl:"Download the app",wait:"Downloading…",meta:"Version {v} · {s} · {a}",
demo:"Try the tasbih now",demop:"Tap the ring to count. This is exactly how the app works.",shots:"App screenshots",cap:["Home","Tasbih","Duas","Prayer"],
fh:"What's inside",features:[["📿","Digital tasbih","Daily goals and a streak counter."],["🤲","Authentic duas","After prayer, sleep, waking, distress and more."],["🕌","Prayer & qibla","Log your prayers, see sunrise, sunset and qibla."],["📊","Statistics","Follow your progress day by day."]],
ih:"How to install",steps:["Tap “Download the app” and wait for it to finish.","Open the file. If Android warns you, allow installs from this source.","Tap Install, then open the app."],foot:"Made with love 🤍"}};

const $=id=>document.getElementById(id);
let lang=localStorage.getItem("lang")||"ar",n=0;
function render(){
  const t=SITE[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("badge").textContent=t.badge;$("tag").textContent=t.tag;$("sub").textContent=t.sub;
  $("dlt").textContent=t.dl;
  $("meta").textContent=t.meta.replace("{v}",SITE.version).replace("{s}",SITE.size).replace("{a}",SITE.android);
  $("sh").textContent=t.shots;
  $("sc").innerHTML=SITE.shots.map((s,i)=>`<figure><img src="${s}" alt="${t.cap[i]}" loading="lazy"><figcaption>${t.cap[i]}</figcaption></figure>`).join("");
  $("foot").textContent=t.foot;$("lang").textContent=lang==="ar"?"EN":"عربي";
}
let busy=false;
$("dl").onclick=async()=>{
  if(busy)return;busy=true;$("dlt").textContent=SITE[lang].wait;
  try{
    const r=await fetch(APK_URL);if(!r.ok)throw 0;
    const b=await r.blob(),u=URL.createObjectURL(new Blob([b],{type:"application/vnd.android.package-archive"})),a=document.createElement("a");
    a.href=u;a.download="dhikrverse.apk";a.style.display="none";document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},60000);
  }catch(e){location.href=APK_URL}
  busy=false;$("dlt").textContent=SITE[lang].dl;
};
$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("lang",lang)}catch(e){}render()};
const st=$("stars");for(let i=0;i<45;i++){const e=document.createElement("i");e.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s`;st.appendChild(e)}
render();
</script>
</body>
</html>
